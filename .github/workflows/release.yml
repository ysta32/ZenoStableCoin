name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          zip -r "zeno-${TAG}-dist.zip" dist
      - name: Publish release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" zeno-*.zip
