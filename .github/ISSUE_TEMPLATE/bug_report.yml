name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Zeno. For security problems, please follow [SECURITY.md](https://github.com/ysta32/ZenoStableCoin/blob/main/SECURITY.md) instead of filing a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
    validations:
      required: false
